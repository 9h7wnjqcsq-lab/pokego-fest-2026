<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="neon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"  result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="ballClip">
      <circle cx="512" cy="512" r="336"/>
    </clipPath>
    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="1024" height="1024" fill="#12151C"/>

    <!-- Icon border neon glow -->
    <g filter="url(#neon)">
      <rect x="2" y="2" width="1020" height="1020" rx="218" ry="218"
            fill="none" stroke="#C42020" stroke-width="5"/>
    </g>

    <!-- Pokeball elements -->
    <g filter="url(#neon)" stroke="#D12828" stroke-linecap="round" stroke-linejoin="round" fill="none">

      <!-- Outer circle -->
      <circle cx="512" cy="512" r="336" stroke-width="11"/>

      <!-- Center band (clipped to circle) -->
      <g clip-path="url(#ballClip)">
        <line x1="176" y1="493" x2="848" y2="493" stroke-width="9"/>
        <line x1="176" y1="531" x2="848" y2="531" stroke-width="9"/>
      </g>

      <!-- Center ring -->
      <circle cx="512" cy="512" r="108" stroke-width="9"/>

      <!-- Center button -->
      <circle cx="512" cy="512" r="56"  stroke-width="9"/>

      <!--
        Decorative arcs — r=230, centered at (512,512)
        Upper: 2 o'clock (711,397) → 11 o'clock (397,313), counterclockwise through 12
        Lower: 8 o'clock (313,627) → 5 o'clock (627,711), counterclockwise through  6
      -->
      <path d="M 711 397 A 230 230 0 0 0 397 313" stroke-width="9"/>
      <path d="M 313 627 A 230 230 0 0 0 627 711" stroke-width="9"/>

    </g>
  </g>
</svg>
